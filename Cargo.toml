[workspace]
resolver = "3"
members = ["core", "tui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["flear <teymurzadehuseyn14@gmail.com>"]
repository = "https://github.com/Huseynteymurzade28/tuiba"
homepage = "https://github.com/Huseynteymurzade28/tuiba"
readme = "README.md"
keywords = ["gba", "emulator", "gameboy", "tui", "ratatui"]
categories = ["emulators", "command-line-utilities", "games"]

[workspace.dependencies]
# Internal crates
tuiba-core = { path = "core", version = "0.3.0" }

# Error handling
thiserror = "2.0"

# Terminal UI
ratatui = "0.30"
crossterm = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Emulator code performs many intentional narrowing casts (u32 -> u16/u8);
# annotating each one would drown the code in `#[allow]`s.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

# Emulation is unusably slow at opt-level 0, even during development.
[profile.dev.package."*"]
opt-level = 2
