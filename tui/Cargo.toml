[package]
name = "tuiba"
description = "Game Boy Advance emulator running in your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tuiba"
path = "src/main.rs"

[[example]]
name = "padlog"
required-features = ["gamepad"]

[dependencies]
tuiba-core.workspace = true
thiserror.workspace = true
ratatui.workspace = true
crossterm.workspace = true
cpal = "0.18"
gilrs = { version = "0.11", optional = true }

[lints]
workspace = true

[features]
default = ["gamepad"]
# Game controllers through gilrs (evdev/libudev on Linux, Windows Gaming
# Input / XInput, IOKit on macOS). Without it only the keyboard plays.
gamepad = ["dep:gilrs"]
